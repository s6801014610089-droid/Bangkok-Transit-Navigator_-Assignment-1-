<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bangkok Transit Navigator</title>
    <style>
        :root {
            --bg: #eef5fc;        /* page */
            --panel: #ffffff;     /* cards */
            --panel-2: #f1f4f8;   /* inputs */
            --line: #cfdcec;
            --text: #1d2530;
            --muted: #6a7587;
            --amber: #2f8cf0;     /* main accent (blue) */
            --amber-d: #1f74d6;
            --amber-text: #1560c0; /* amber that is readable on white */
            --bad: #d93a3a;
            --good: #1c8a5b;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); color-scheme: light;
            font-family: "Segoe UI", system-ui, sans-serif; }

        /* ---- top bar ---- */
        header { display: flex; align-items: center; gap: 14px; padding: 16px 28px;
            border-bottom: 3px solid var(--amber); background: #ffffff; box-shadow: 0 1px 6px rgba(20,30,50,.08); }
        .logo { width: 34px; height: 34px; border-radius: 9px; background: var(--amber); color: #fff;
            display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: -1px; }
        header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .4px; }
        header small { color: var(--muted); margin-left: auto; font-size: 13px; }

        main { max-width: 1560px; margin: 0 auto; padding: 22px 28px 40px; }
        .panel { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: 0 1px 4px rgba(20,30,50,.05); }
        .panel h2 { margin: 0 0 12px; font-size: 12px; font-weight: 700; letter-spacing: 1.6px;
            text-transform: uppercase; color: var(--muted); }

        /* ---- planner (one wide bar) ---- */
        #planner { display: grid; grid-template-columns: 1.4fr auto 1.4fr 150px; gap: 14px; align-items: end; }
        label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
        input[type=text], input[type=time] {
            width: 100%; padding: 11px 12px; font-size: 16px; color: var(--text);
            background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; outline: none; }
        input[type=text]:focus, input[type=time]:focus { border-color: var(--amber); }
        #swap { margin: 0; padding: 10px 12px; font-size: 18px; background: var(--panel-2);
            color: var(--amber-text); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
        #swap:hover { border-color: var(--amber); }

        #options { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; margin-top: 16px; }
        .seg { display: inline-flex; background: var(--panel-2); border: 1px solid var(--line);
            border-radius: 10px; overflow: hidden; }
        .seg label { cursor: pointer; }
        .seg input { display: none; }
        .seg span { display: block; padding: 9px 15px; font-size: 14px; color: var(--muted); }
        .seg input:checked + span { background: var(--amber); color: #fff; font-weight: 700; }
        .check { font-size: 14px; color: var(--text); display: flex; align-items: center; gap: 8px; cursor: pointer; padding-bottom: 8px; }
        .check input { accent-color: var(--amber); width: 16px; height: 16px; }

        .btn { background: var(--amber); color: #fff; font-weight: 800; font-size: 16px; border: 0;
            padding: 12px 22px; border-radius: 10px; cursor: pointer; }
        .btn:hover { background: var(--amber-d); }
        .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 600; }
        .btn.ghost:hover { border-color: var(--amber); color: var(--amber-text); }
        .btn.small { padding: 9px 14px; font-size: 14px; }

        #closedRow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
        #closedInput { max-width: 330px; }
        .chip { display: inline-flex; align-items: center; background: rgba(217,58,58,.08); color: var(--bad);
            border: 1px solid rgba(217,58,58,.4); border-radius: 999px; padding: 4px 12px; font-size: 13px; cursor: pointer; }
        .chip:hover { background: rgba(217,58,58,.18); }

        #actions { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
        #error { color: var(--bad); font-size: 14px; min-height: 20px; margin-top: 12px; }
        #shareMsg { color: var(--good); font-size: 13px; }

        /* ---- result: timeline + map ---- */
        #result { display: grid; grid-template-columns: 400px minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
        @media (max-width: 1000px) { #result { grid-template-columns: 1fr; } #planner { grid-template-columns: 1fr; } }

        #steps { position: relative; margin-left: 6px; }
        #steps .empty { color: var(--muted); font-size: 14px; }
        .step { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 10px;
            padding: 0 0 14px 18px; border-left: 3px solid var(--line); font-size: 14.5px; line-height: 1.4; }
        .step:last-child { border-left-color: transparent; padding-bottom: 0; }
        .step::before { content: ""; position: absolute; left: -8px; top: 3px; width: 13px; height: 13px;
            border-radius: 50%; background: var(--dot, var(--muted)); border: 3px solid var(--panel); }
        .step time { font-family: ui-monospace, Consolas, monospace; color: var(--amber-text); font-weight: 700; }
        .step.wait { color: var(--muted); font-style: italic; }
        .step.wait::before { background: var(--panel-2); border-color: var(--muted); }
        .step.note { display: block; border: 1px solid var(--amber); border-radius: 8px; color: var(--amber-text);
            padding: 8px 12px; margin: 0 0 14px -6px; background: rgba(47,140,240,.12); }
        .step.note::before { display: none; }
        #total { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--panel-2);
            font-family: ui-monospace, Consolas, monospace; font-weight: 700; color: var(--good); }
        #total:empty { display: none; }

        /* the map sheet */
        #mapSheet { background: #ffffff; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
        #map { overflow-x: auto; color: #333; }
        #mapSvg { width: 100%; min-width: 1100px; height: auto; display: block; font-family: system-ui, sans-serif; }
        #mapSvg.dim .base { opacity: 0.3; }
    </style>
</head>
<body>
<header>
    <div class="logo">BKK</div>
    <h1>Bangkok Transit Navigator</h1>
    <small>BTS &amp; MRT route planner</small>
</header>

<main>
    <section class="panel">
        <h2>Plan a trip</h2>
        <div id="planner">
            <div>
                <label class="f" for="from">From</label>
                <input type="text" id="from" list="stationList" placeholder="Type a station name" autocomplete="off">
            </div>
            <button id="swap" type="button" title="Swap origin and destination">&#8644;</button>
            <div>
                <label class="f" for="to">To</label>
                <input type="text" id="to" list="stationList" placeholder="Type a station name" autocomplete="off">
            </div>
            <div>
                <label class="f" for="time">Time</label>
                <input type="time" id="time" value="08:15">
            </div>
        </div>
        <datalist id="stationList"></datalist>

        <div id="options">
            <div class="seg">
                <label><input type="radio" name="mode" value="depart" checked><span>Depart at</span></label>
                <label><input type="radio" name="mode" value="arrive"><span>Arrive by</span></label>
            </div>
            <div class="seg">
                <label><input type="radio" name="goal" value="fastest" checked><span>Fastest time</span></label>
                <label><input type="radio" name="goal" value="fewest"><span>Fewest interchanges</span></label>
            </div>
            <label class="check"><input type="checkbox" id="waitBox"> Include waiting time (train every 4-6 min)</label>
        </div>

        <div id="closedRow">
            <input type="text" id="closedInput" list="stationList" placeholder="Closed for maintenance: type a station" autocomplete="off">
            <button id="addClosed" type="button" class="btn ghost small">Close station</button>
            <span id="closedList"></span>
        </div>

        <div id="actions">
            <button id="go" class="btn">Find route</button>
            <button id="share" type="button" class="btn ghost">Copy link</button>
            <span id="shareMsg"></span>
        </div>
        <div id="error"></div>
    </section>

    <div id="result">
        <section class="panel">
            <h2>Your journey</h2>
            <div id="steps"><div class="empty">Choose two stations and press Find route.</div></div>
            <div id="total"></div>
        </section>

        <section class="panel">
            <h2>Network map <span style="text-transform:none;letter-spacing:0;font-weight:400">(orange = your route)</span></h2>
            <div id="mapSheet"><div id="map">Loading map...</div></div>
        </section>
    </div>
</main>

<script src="map.js"></script>
<script>
    const $ = id => document.getElementById(id);

    // Fill the station list (dropdown with typing)
    fetch('/api/stations').then(r => r.json()).then(list => {
        const dl = $('stationList');
        for (const s of list) {
            const o = document.createElement('option');
            o.value = s.name;
            o.label = s.codes.join(' / ');
            dl.appendChild(o);
        }
    });

    // Swap origin and destination
    $('swap').addEventListener('click', () => {
        const a = $('from').value;
        $('from').value = $('to').value;
        $('to').value = a;
    });

    // Bonus: stations closed for maintenance (the labels from the dropdown)
    let closed = [];
    function showClosed() {
        const box = $('closedList');
        box.textContent = '';
        for (const name of closed) {
            const c = document.createElement('span');
            c.className = 'chip';
            c.textContent = name + '  \u2715';
            c.title = 'Click to reopen this station';
            c.onclick = () => { closed = closed.filter(x => x !== name); showClosed(); };
            box.appendChild(c);
        }
    }
    $('addClosed').addEventListener('click', () => {
        const v = $('closedInput').value.trim();
        if (v && !closed.includes(v)) closed.push(v);
        $('closedInput').value = '';
        showClosed();
    });

    // Read the form into URL parameters (also used as the shareable link)
    function formParams() {
        const p = new URLSearchParams({
            from: $('from').value,
            to: $('to').value,
            time: $('time').value,
            mode: document.querySelector('input[name=mode]:checked').value,
            goal: document.querySelector('input[name=goal]:checked').value
        });
        if (closed.length > 0) p.set('closed', closed.join('|'));
        if ($('waitBox').checked) p.set('wait', '1');
        return p;
    }

    // Colour of the dot for a step, taken from the line named in the text
    function dotColor(text) {
        const colors = (typeof LINE_COLOR !== 'undefined') ? LINE_COLOR : {};
        for (const name in colors) {
            if (text.indexOf(name) >= 0) return colors[name];
        }
        return null;
    }

    // Show the itinerary as a vertical timeline
    function showSteps(lines) {
        const box = $('steps');
        box.textContent = '';
        for (const text of lines) {
            const row = document.createElement('div');
            row.className = 'step';
            const m = text.match(/^(\d\d:\d\d) (.*)$/);
            if (!m) {                                  // the "Note: ..." line
                row.classList.add('note');
                row.textContent = text;
            } else {
                const t = document.createElement('time');
                t.textContent = m[1];
                const body = document.createElement('span');
                body.textContent = m[2];
                if (m[2].startsWith('Wait')) row.classList.add('wait');
                const c = dotColor(m[2]);
                if (c) row.style.setProperty('--dot', c);
                else if (m[2].startsWith('Arrive') && lines.indexOf(text) === lines.length - 1) row.style.setProperty('--dot', '#ff7a00');
                row.appendChild(t);
                row.appendChild(body);
            }
            box.appendChild(row);
        }
    }

    function findRoute() {
        const params = formParams();
        $('error').textContent = '';
        fetch('/api/route?' + params).then(r => r.json()).then(res => {
            if (!res.ok) {
                $('error').textContent = res.error;
                $('steps').textContent = '';
                $('total').textContent = '';
                clearRoute();
                return;
            }
            showSteps(res.steps);
            $('total').textContent = res.summary;
            highlightRoute(res.path);
            // Bonus: put the query in the address bar so the link can be shared
            history.replaceState(null, '', '?' + params);
        }).catch(() => { $('error').textContent = 'Cannot reach the server.'; });
    }

    $('go').addEventListener('click', findRoute);

    $('share').addEventListener('click', () => {
        const link = location.origin + location.pathname + '?' + formParams();
        const done = () => { $('shareMsg').textContent = 'Link copied.'; };
        if (navigator.clipboard) navigator.clipboard.writeText(link).then(done, () => prompt('Copy this link:', link));
        else prompt('Copy this link:', link);
    });

    // Draw the whole network once, then open a shared link if there is one
    fetch('/api/network').then(r => r.json()).then(net => {
        drawMap(net, $('map'));
        const q = new URLSearchParams(location.search);
        if (q.has('from') && q.has('to')) {
            $('from').value = q.get('from');
            $('to').value = q.get('to');
            if (q.get('time')) $('time').value = q.get('time');
            if (q.get('closed')) { closed = q.get('closed').split('|').filter(x => x); showClosed(); }
            if (q.get('wait') === '1') $('waitBox').checked = true;
            const mode = document.querySelector('input[name=mode][value="' + q.get('mode') + '"]');
            if (mode) mode.checked = true;
            const goal = document.querySelector('input[name=goal][value="' + q.get('goal') + '"]');
            if (goal) goal.checked = true;
            findRoute();
        }
    });
</script>
<script>
    /* Grouped station picker: enhances every <input list="stationList">.
       Groups by line (colored header), ordered by station code. Input value stays = station name. */
    (function () {
        var GROUPS = [
            { id: 'sukhumvit', title: 'BTS สายสุขุมวิท (Sukhumvit) N24 → E23', color: '#7ac143', test: /^(N|E|CEN)/ },
            { id: 'silom',     title: 'BTS สายสีลม (Silom) W1 → S12',          color: '#1b7a4d', test: /^(W|S\d|CEN)/ },
            { id: 'blue',      title: 'MRT สายสีน้ำเงิน (Blue) BL01 → BL37',    color: '#1f4fa3', test: /^BL/ },
            { id: 'purple',    title: 'MRT สายสีม่วง (Purple) PP16',            color: '#7b3fa0', test: /^PP/ },
            { id: 'other',     title: 'อื่น ๆ',                                  color: '#888',    test: /./ }
        ];
        function lineOf(code, gid) {
            if (code === 'CEN') return gid === 'sukhumvit' || gid === 'silom';
            for (var i = 0; i < GROUPS.length; i++) if (GROUPS[i].id === gid) return GROUPS[i].test.test(code);
            return false;
        }
        function primaryGroup(code) {
            if (code === 'CEN') return ['sukhumvit', 'silom'];
            if (/^(N|E)\d/.test(code)) return ['sukhumvit'];
            if (/^(W|S)\d/.test(code)) return ['silom'];
            if (/^BL/.test(code)) return ['blue'];
            if (/^PP/.test(code)) return ['purple'];
            return ['other'];
        }
        function sortKey(code) {           // N24..N1, CEN, E1..E23 ; W1, CEN, S1.. ; BL01..
            if (code === 'CEN') return 0;
            var m = /^([A-Z]+)(\d+)([A-Z]?)$/.exec(code); if (!m) return 9999;
            var n = parseInt(m[2], 10) + (m[3] ? 0.5 : 0);
            if (m[1] === 'N' || m[1] === 'W') return -n;   // before CEN, descending
            return n;
        }
        function readOptions() {
            var out = [];
            var opts = document.querySelectorAll('#stationList option');
            opts.forEach(function (o) {
                var name = o.value, text = (o.label || o.textContent || '');
                var codes = text.match(/CEN|(?:BL|PP|N|E|W|S)\d+[A-Z]?/g) || [];
                if (name) out.push({ name: name, codes: codes });
            });
            return out;
        }
        function build(items) {
            var map = {};
            GROUPS.forEach(function (g) { map[g.id] = []; });
            items.forEach(function (it) {
                var codes = it.codes.length ? it.codes : ['?'];
                codes.forEach(function (c) {
                    primaryGroup(c).forEach(function (gid) { map[gid].push({ code: c, name: it.name }); });
                });
            });
            GROUPS.forEach(function (g) { map[g.id].sort(function (a, b) { return sortKey(a.code) - sortKey(b.code); }); });
            return map;
        }
        var css = document.createElement('style');
        var EXTRA = '#closedRow .sp-wrap{width:330px;max-width:100%}';
        css.textContent =
            '.sp-wrap{position:relative}' +
            '.sp-panel{position:absolute;z-index:50;left:0;right:0;top:100%;max-height:340px;overflow:auto;background:#fff;border:1px solid #d9d9d9;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);margin-top:4px;display:none;min-width:260px}' +
            '.sp-head{position:sticky;top:0;color:#fff;font-size:12px;font-weight:700;padding:5px 10px}' +
            '.sp-item{display:flex;align-items:center;gap:8px;padding:5px 10px;cursor:pointer;font-size:14px;color:#222}' +
            '.sp-item.act,.sp-item:hover{background:#e3f0ff}' +
            '.sp-badge{min-width:44px;text-align:center;color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 6px}' + EXTRA;
        document.head.appendChild(css);

        function enhance(input) {
            if (input._sp) return; input._sp = true;
            input.removeAttribute('list');
            input.setAttribute('autocomplete', 'off');
            var wrap = document.createElement('div'); wrap.className = 'sp-wrap';
            wrap.style.display = 'block';
            input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
            var panel = document.createElement('div'); panel.className = 'sp-panel'; wrap.appendChild(panel);
            var rows = [], active = -1;

            function render() {
                var q = input.value.trim().toLowerCase();
                var data = build(readOptions());
                panel.innerHTML = ''; rows = [];
                GROUPS.forEach(function (g) {
                    var list = data[g.id].filter(function (x) {
                        return !q || x.name.toLowerCase().indexOf(q) >= 0 || x.code.toLowerCase().indexOf(q) >= 0;
                    });
                    if (!list.length) return;
                    var h = document.createElement('div'); h.className = 'sp-head'; h.style.background = g.color; h.textContent = g.title;
                    panel.appendChild(h);
                    list.forEach(function (x) {
                        var d = document.createElement('div'); d.className = 'sp-item';
                        d.innerHTML = '<span class="sp-badge" style="background:' + g.color + '"></span><span></span>';
                        d.children[0].textContent = x.code; d.children[1].textContent = x.name;
                        d.addEventListener('mousedown', function (e) { e.preventDefault(); pick(x.name); });
                        panel.appendChild(d); rows.push(d); d._name = x.name;
                    });
                });
                active = -1;
            }
            function open() { render(); panel.style.display = 'block'; }
            function close() { panel.style.display = 'none'; }
            function pick(name) {
                input.value = name; close();
                input.dispatchEvent(new Event('change', { bubbles: true }));
            }
            function mark(i) {
                rows.forEach(function (r) { r.classList.remove('act'); });
                if (i >= 0 && i < rows.length) { active = i; rows[i].classList.add('act'); rows[i].scrollIntoView({ block: 'nearest' }); }
            }
            input.addEventListener('focus', open);
            input.addEventListener('click', open);
            input.addEventListener('input', function () { if (panel.style.display !== 'block') panel.style.display = 'block'; render(); });
            input.addEventListener('blur', close);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'ArrowDown') { e.preventDefault(); if (panel.style.display !== 'block') open(); mark(Math.min(active + 1, rows.length - 1)); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); mark(Math.max(active - 1, 0)); }
                else if (e.key === 'Enter' && active >= 0) { e.preventDefault(); pick(rows[active]._name); }
                else if (e.key === 'Escape') close();
            });
        }
        function init() {
            var dl = document.getElementById('stationList');
            if (!dl) return;
            function go() {
                if (!dl.children.length) return false;
                document.querySelectorAll('input[list="stationList"]').forEach(enhance);
                return true;
            }
            if (!go()) new MutationObserver(function (m, ob) { if (go()) ob.disconnect(); }).observe(dl, { childList: true });
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
    })();

</script>
</body>
</html>
